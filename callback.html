<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Sign-in complete</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><span class="a">Clip</span> <span class="b">Uploader</span></h1>
  <p>Sign-in step</p>
</header>
<main>
  <div class="card" id="ok" hidden>
    <p><strong>Almost done.</strong> Copy this whole address and paste it back into Clip Uploader:</p>
    <span class="code" id="url"></span>
    <button id="copy">Copy</button> <span id="copied"></span>
  </div>
  <div class="card" id="err" hidden>
    <p><strong>Sign-in was not completed.</strong></p>
    <span class="code" id="msg"></span>
  </div>
  <p>This page only displays the address. Nothing is sent or stored by this website.</p>
</main>
<script src="callback.js"></script>
</body>
</html>
